<script>
  // Prefetch: the game opens its files one at a time and waits for each fetch,
  // so the ~1,000 files read before the main menu (and ~700 more when a course
  // loads) cost a round trip each. preload.txt lists them in the order a first
  // run reads them; they're fetched a few at a time from page start, and the
  // game's fetch of a listed file takes the prefetched copy. ?noprefetch turns
  // it off.
  (function () {
    if (Module.localFiles || /noprefetch/.test(location.search)) return;
    var realFetch = window.fetch.bind(window);
    var ready = new Map(), taken = new Set(), list = [], next = 0, inflight = 0;
    var MAX_INFLIGHT = 8, MAX_AHEAD = 400;
    function get(url) {

        return r.ok ? r.arrayBuffer().then(function (b) { return new Response(b); }) : r;
      }).catch(function () { return realFetch(url); }).finally(function () { inflight--; pump(); });
    }
    function pump() {
      while (inflight < MAX_INFLIGHT && ready.size < MAX_AHEAD && next < list.length) {
        var url = list[next++];
        if (!taken.has(url)) ready.set(url, get(url));
      }
    }
    window.fetch = function (input, init) {
      if (typeof input === 'string' && input.lastIndexOf('game/', 0) === 0) {

      });
      pump();
    }).catch(function () {});
  })();
</script>
<script>
  // Crash reports: the last console lines plus the error go to the dev server
  // (tools/boxedwine/serve.mjs appends them to build/browser.log).
  (function () {
    if (Module.localFiles) return;
    var lines = [], sent = 0;
    ['log', 'warn', 'error'].forEach(function (k) {
      var orig = console[k];

    if(!name)return {error:'Enter a name for this save.'};
    if(name.length>max)return {error:'Use up to '+max+' characters.'};
    if(/[^\x20-\x7e]|[<>:"/\\|?*]|\.$/.test(name))return {error:'Use standard filename characters, with no slashes or trailing dot.'};
    if(/^(?:con|prn|aux|nul|conin\$|conout\$|com[1-9]|lpt[1-9])$/i.test(name.split('.')[0].trimEnd())||
       /^(?:&autosave[1-3]|&quitsave|while_browsing|top10)$/i.test(name))return {error:'That name is reserved. Choose another save name.'};
    return {name};
  }
  input.addEventListener('input',()=>{
    if(session)session.edited=true;
    error.textContent='';input.removeAttribute('aria-invalid');
  });
  form.addEventListener('submit',event=>{
    event.preventDefault();
    if(!session?.answer||session.closed)return;
    const result=filename(input.value,session.max);
    if(result.error){
      error.textContent=result.error;input.setAttribute('aria-invalid','true');input.focus({preventScroll:true});return;
    }
    finish(result.name);
  });
  document.getElementById('mobile-save-name-cancel').onclick=()=>finish(null);
  dialog.addEventListener('cancel',event=>{event.preventDefault();finish(null);});
  addEventListener('pagehide',()=>finish(null));
  for(const type of ['pointerdown','pointerup','pointermove','pointercancel','mousedown','mouseup','mousemove','click','dblclick','touchstart','touchmove','touchend','touchcancel','wheel'])
    dialog.addEventListener(type,event=>event.stopPropagation());
  for(const type of ['keydown','keyup','keypress'])addEventListener(type,event=>{
    const code=event.code||event.key;
    if(type==='keyup'){
      if(held.delete(code)){event.preventDefault();event.stopImmediatePropagation();}
      return;
    }
    if(!dialog.open){
      if(held.has(code)){event.preventDefault();event.stopImmediatePropagation();}
      return;
    }
    event.stopImmediatePropagation();
    if(type!=='keydown')return;
    if(held.has(code)&&event.key==='Enter'){event.preventDefault();return;}
    held.add(code);
    if(event.isComposing||event.keyCode===229)return;
    if(event.key==='Escape'){event.preventDefault();finish(null);}
    else if(event.key==='Enter'&&event.target===input){
      event.preventDefault();if(!submit.disabled)form.requestSubmit();
    }
  },true);
  addEventListener('blur',()=>held.clear());
  for(const type of ['simgolf-screen-resize','simgolf-header-resize','resize'])addEventListener(type,layout);
  window.visualViewport?.addEventListener('resize',layout);
  window.visualViewport?.addEventListener('scroll',layout);
})();
