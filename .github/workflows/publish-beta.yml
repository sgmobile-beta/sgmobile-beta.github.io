{
  "name": "Publish SGMobile Beta to GitHub Pages",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "confirm_publication": {
          "description": "Publish the reviewed game publicly at sgmobile-beta.github.io",
          "required": true,
          "type": "boolean",
          "default": false
        },
        "manifest_sha256": {
          "description": "Approved SHA-256 of site/release.json",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "github-pages",
    "cancel-in-progress": false
  },
  "jobs": {
    "verify_and_upload": {
      "if": "github.repository == 'sgmobile-beta/sgmobile-beta.github.io' && github.ref == 'refs/heads/main' && inputs.confirm_publication",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify the reviewed game package",
          "env": {
            "REVIEWED_MANIFEST_SHA256": "${{ inputs.manifest_sha256 }}"
          },
          "run": "python3 .github/verify-beta-site.py"
        },
        {
          "name": "Read existing Pages settings",
          "uses": "actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b",
          "with": {
            "enablement": false
          }
        },
        {
          "name": "Upload only the verified site",
          "uses": "actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b",
          "with": {
            "path": "site"
          }
        }
      ]
    },
    "deploy": {
      "needs": "verify_and_upload",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "permissions": {
        "pages": "write",
        "id-token": "write"
      },
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deployment.outputs.page_url }}"
      },
      "steps": [
        {
          "id": "deployment",
          "uses": "actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e"
        }
      ]
    }
  }
}
